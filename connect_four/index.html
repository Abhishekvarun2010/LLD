<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Four</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #15253d;
      background: #f3f7fc;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }

    main {
      width: min(92vw, 640px);
      text-align: center;
    }

    h1 { margin-bottom: 4px; }
    #status { margin: 0 0 16px; font-weight: bold; }

    .column-buttons, #board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .column-buttons { margin-bottom: 8px; }

    .column-buttons button, #new-game {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .column-buttons button {
      padding: 10px 0;
      color: white;
      background: #1e5aa8;
    }

    .column-buttons button:hover { background: #174985; }

    #board {
      padding: 10px;
      background: #1e5aa8;
      border-radius: 12px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f7f9fc;
    }

    .cell.red { background: #e63946; }
    .cell.yellow { background: #f9c74f; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .actions button {
      padding: 10px 18px;
      color: white;
      background: #15253d;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .actions button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Connect Four</h1>
    <p id="status">Red's turn</p>
    <div class="column-buttons" id="column-buttons"></div>
    <div id="board" aria-label="Connect Four board"></div>
    <div class="actions">
      <button id="undo" disabled>Undo move</button>
      <button id="new-game">New game</button>
    </div>
  </main>

  <script>
    const boardElement = document.querySelector("#board");
    const buttonsElement = document.querySelector("#column-buttons");
    const statusElement = document.querySelector("#status");
    const undoButton = document.querySelector("#undo");
    let game;

    async function getGame() {
      const response = await fetch("/api/game");
      return response.json();
    }

    async function reset() {
      const response = await fetch("/api/game", { method: "POST" });
      game = await response.json();
      render();
    }

    async function undoMove() {
      const response = await fetch("/api/undo", { method: "POST" });
      const result = await response.json();
      game = result.game;
      render();
    }

    function render() {
      boardElement.replaceChildren();
      buttonsElement.replaceChildren();

      game.board.flat().forEach((disc) => {
        const cell = document.createElement("div");
        cell.className = `cell ${disc ?? ""}`;
        boardElement.append(cell);
      });

      for (let column = 0; column < game.board[0].length; column += 1) {
        const button = document.createElement("button");
        button.textContent = "↓";
        button.setAttribute("aria-label", `Drop disc in column ${column + 1}`);
        button.disabled = game.state !== "IN_PROGRESS" || game.board[0][column] !== null;
        button.addEventListener("click", () => makeMove(column));
        buttonsElement.append(button);
      }

      undoButton.disabled = !game.canUndo;

      if (game.state === "WON") {
        statusElement.textContent = `${game.winner} wins!`;
      } else if (game.state === "DRAW") {
        statusElement.textContent = "It's a draw!";
      } else {
        statusElement.textContent = `${game.currentPlayer}'s turn`;
      }
    }

    async function makeMove(column) {
      const response = await fetch("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ column }),
      });
      const result = await response.json();
      game = result.game;
      render();
    }

    document.querySelector("#new-game").addEventListener("click", reset);
    undoButton.addEventListener("click", undoMove);
    getGame().then((data) => {
      game = data;
      render();
    });
  </script>
</body>
</html>
